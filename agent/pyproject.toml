[project]
name = "travel-agent"
version = "0.1.0"
description = "Trip-planning agent (Claude Agent SDK) on top of the travel-mcp server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.163,<0.3",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
travel-agent = "travel_agent.cli:main"
travel-eval = "travel_agent.evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

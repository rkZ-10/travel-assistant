# Policy sources for search_policies. Official pages only.
# Each entry: id, airline (IATA code, or DGCA for regulations), title, and url, file, or both.
# `file:` paths are relative to this folder — use rag/manual/ for pages and PDFs you save yourself.
# With both url and file, the saved file is indexed and the url is cited. IndiGo and Air India
# don't answer non-browser clients, so save those pages from a browser (Ctrl+S, "Webpage, HTML only").
# ingest honours robots.txt: a URL the site disallows for bots must be saved by hand instead.
# `note:` is shown alongside every result from that source.
# After editing:  uv run travel-rag ingest

sources:
  - id: indigo-baggage
    airline: 6E
    title: IndiGo — Baggage allowance
    url: https://www.goindigo.in/travel-information/en/baggage-allowance.html
    file: manual/indigo-baggage.html
    topics: [baggage]

  - id: indigo-fees
    airline: 6E
    title: IndiGo — Fees and charges
    url: https://www.goindigo.in/information/fees-and-charges.html
    file: manual/indigo-fees.html
    topics: [cancellation, change, fees, baggage]

  - id: indigo-fare-rules
    airline: 6E
    title: IndiGo — Fare rules
    url: https://www.goindigo.in/travel-information/en/fare-rules.html
    file: manual/indigo-fare-rules.html
    topics: [fares, cancellation, change]

  - id: indigo-disruptions
    airline: 6E
    title: IndiGo — Flight delays and cancellations
    url: https://www.goindigo.in/travel-information/en/flight-delays-cancellations.html
    file: manual/indigo-disruptions.html
    topics: [delay, cancellation, refund]

  - id: airindia-smart-fares
    airline: AI
    title: Air India — Smart Fares (fare families)
    url: https://www.airindia.com/in/en/book/smart-fares.html
    file: manual/airindia-smart-fares.html
    topics: [fares, baggage, cancellation, change]

  - id: airindia-baggage-faq
    airline: AI
    title: Air India — Baggage FAQ
    url: https://www.airindia.com/in/en/frequently-asked-questions/baggage.html
    file: manual/airindia-baggage-faq.html
    topics: [baggage]
    note: Air India publishes exact allowances per booking via its baggage calculator; this page has general rules only.

  - id: akasa-baggage
    airline: QP
    title: Akasa Air — Baggage
    url: https://www.akasaair.com/information/baggage
    topics: [baggage]

  - id: akasa-faq
    airline: QP
    title: Akasa Air — Customer support FAQ
    url: https://www.akasaair.com/customer-support/faq
    topics: [cancellation, change, refund, baggage]

  # Air India Express: robots.txt disallows automated fetching of its documents, and its FAQ pages
  # are rendered by JavaScript, so both are saved from a browser.
  - id: airindiaexpress-fees
    airline: IX
    title: Air India Express — Fees and charges (mandatory disclosure)
    url: https://www.airindiaexpress.com/content/dam/airindiaexpress/documents/mandatory-disclosure/fees-and-charges.pdf
    file: manual/airindiaexpress-fees.pdf
    topics: [cancellation, change, fees, baggage]

  - id: airindiaexpress-baggage-faq
    airline: IX
    title: Air India Express — Baggage FAQ
    url: https://www.airindiaexpress.com/support/faqs/baggage
    file: manual/airindiaexpress-baggage-faq.html
    topics: [baggage]

  - id: spicejet-terms
    airline: SG
    title: SpiceJet — Terms of carriage (change and cancellation fees, baggage)
    url: https://corporate.spicejet.com/Tnc.aspx
    file: manual/spicejet-terms.html  # automated fetch returns an empty page; saved from a browser
    topics: [cancellation, change, fees, baggage, refund]

  - id: allianceair-tariff
    airline: 9I
    title: Alliance Air — Domestic tariff sheet (fare rules, effective 1 Sep 2025)
    url: https://plone.allianceair.in/allianceair/en/assets/tariff-sheet/alliance-air-domestic-tariff-sheet_01sep25.pdf
    topics: [fares, cancellation, change, refund]
    note: >-
      This PDF has two change/cancellation tables. The one "effective 01st August 2025" is current;
      the "15th April 2022 till 31st Jul 2025" table is history.

  - id: allianceair-faq
    airline: 9I
    title: Alliance Air — FAQs (Aug 2025)
    url: https://plone.allianceair.in/allianceair/en/assets/faqs/faqs-25-8-2025.pdf
    topics: [baggage, cancellation, refund]

  - id: dgca-car-m4
    airline: DGCA
    title: DGCA CAR Section 3 Series M Part IV — Denied boarding, cancellations and delays (Rev 4, Jan 2023)
    url: https://www.dgca.gov.in/digigov-portal/Upload?flag=iframeAttachView&attachId=we1PSlOuQhYdHcwKKrm7ew%3D%3D
    topics: [compensation, delay, cancellation, denied-boarding]

  - id: dgca-car-m2-2019
    airline: DGCA
    title: DGCA CAR Section 3 Series M Part II — Refund of airline tickets (2019 revision)
    url: https://www.dgca.gov.in/digigov-portal/Upload?flag=iframeAttachView&attachId=NEYrfyUarqXt9W7QigEe3Q%3D%3D&baseLocale=en_US
    topics: [refund, cancellation]
    note: >-
      Superseded — DGCA revised this CAR on 24 Feb 2026 (effective 26 Mar 2026). Verify against
      the current version before relying on it. If you download the 2026 PDF from dgca.gov.in,
      save it as rag/manual/dgca-car-m2-2026.pdf and uncomment the entry below.


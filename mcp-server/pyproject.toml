[project]
name = "travel-mcp"
version = "0.1.0"
description = "MCP server for Indian domestic flight search, day-of-travel status, airline policy RAG and travel preferences"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "fastembed>=0.8",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
travel-mcp = "travel_mcp.server:main"
travel-rag = "travel_mcp.rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
